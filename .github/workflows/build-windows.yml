name: Build Windows x64

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopIncenseBurner.csproj

      - name: Build and publish self-contained Windows x64
        run: dotnet publish DesktopIncenseBurner.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopIncenseBurner-win-x64
          path: publish/
          if-no-files-found: error
